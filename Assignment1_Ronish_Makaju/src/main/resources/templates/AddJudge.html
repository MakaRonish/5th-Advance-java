<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Judge</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="page-overlay"></div>
<div class="navbar">
    <div class="logo"><a th:href="@{/}">DOGSHOW</a></div>

    <div class="nav-links">
        <a th:href="@{/addDog}">Add Dog</a>
        <a th:href="@{/addOwner}">Add Owner</a>
        <a th:href="@{/addJudge}">Add Judge</a>
        <a th:href="@{/assignOwner}">Assign Owner</a>
        <a th:href="@{/assignJudge}">Assign Judge</a>
        <a th:href="@{/viewDogs}">View Dogs</a>
        <a th:href="@{/viewOwners}">View Owners</a>
        <a th:href="@{/viewJudges}">View Judges</a>
    </div>
</div>

<div class="page-wrapper">
    <div class="container">
        <div class="page-header">
            <span class="page-eyebrow">Management</span>
            <h1 class="page-title">Add Judge</h1>
            <div class="page-line"></div>
        </div>

        <div class="form-card">
            <form th:action="@{/addJudge}" th:object="${judge}" method="post">
                <div class="form-group">
                    <label>Judge Name</label>
                    <input type="text" th:field="*{name}" placeholder="Enter judge's full name" />
                </div>
                <div class="form-actions">
                    <button type="submit">Save Judge</button>
                    <a th:href="@{/}" class="btn-back">← Back to Home</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
