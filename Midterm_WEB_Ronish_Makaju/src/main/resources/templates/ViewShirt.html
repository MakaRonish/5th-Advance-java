<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>View Shirts</title>
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
</head>
<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/view/shirts}">Shirts</a>
    <a th:href="@{/add}">Add Shirt</a>
    <a th:href="@{/view/therapist}">Therapist</a>
    <a class="add" th:href="@{/addTherapist}">Add Therapist</a>
</nav>

<div class="container">
    <h1>Shirt List</h1>

    <table>
        <tr>
            <th>Shirt ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Employee Name</th>
            <th>Purchase</th>
            <th>Delete</th>
        </tr>

        <tr th:each="shirt : ${shirtList}">
            <td th:text="${shirt.id}"></td>
            <td th:text="${shirt.name}"></td>
            <td th:text="${shirt.price}"></td>
            <td th:text="${shirt.quantity}"></td>
            <td th:text="${shirt.employeeName}"></td>
            <td>
                <span th:if="${shirt.quantity > 0}">
                    <a th:href="@{/purchase/shirt/{id}(id=${shirt.id})}">Purchase</a>
                </span>
                <span th:if="${shirt.quantity == 0}">
                    Sold
                </span>
            </td>
            <td>
                <a th:href="@{/delete/shirt/{id}(id=${shirt.id})}">Delete</a>
            </td>
        </tr>
    </table>
</div>
</body>
</html>
