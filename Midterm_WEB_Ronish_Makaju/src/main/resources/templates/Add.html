<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Shirt</title>
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
</head>
<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/view/shirts}">Shirts</a>
    <a th:href="@{/add}">Add Shirt</a>
    <a th:href="@{/view/therapist}">Therapist</a>
    <a class="add" th:href="@{/addTherapist}">Add Therapist</a>
</nav>

<div class="container">
    <h1>Add a New Shirt</h1>

    <form th:action="@{/add}" method="post" th:object="${shirt}">
        <label>Name:</label>
        <input type="text" th:field="*{name}" placeholder="Shirt Name" required>

        <label>Employee Name:</label>
        <select th:field="*{employeeName}">
            <option th:each="therapist : ${therapists}" 
                    th:value="${therapist.name}" 
                    th:text="${therapist.name}">
            </option>
        </select>

        <label>Price:</label>
        <input type="number" step="0.01" th:field="*{price}" required>

        <label>Quantity:</label>
        <input type="number" th:field="*{quantity}" required>

        <input type="submit" value="Add Shirt">
    </form>
</div>
</body>
</html>
