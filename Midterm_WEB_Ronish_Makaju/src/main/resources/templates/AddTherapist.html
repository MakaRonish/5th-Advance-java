<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Add Shirt</title>
<link rel="stylesheet" type="text/css" th:href="@{/css/styles.css}">
</head>
<body>
<nav>
    <a th:href="@{/}">Home</a>
    <a th:href="@{/view/shirts}">Shirts</a>
    <a th:href="@{/add}">Add Shirt</a>
    <a th:href="@{/view/therapist}">Therapist</a>
    <a class="add" th:href="@{/addTherapist}">Add Therapist</a>
</nav>

<div class="container">
    <h1>Add a New Shirt</h1>

    <form th:action="@{/addTherapist}" method="post" th:object="${therapist}">
        <label>Name:</label>
        <input type="text" th:field="*{name}" placeholder=" Name" required>

        

        <input type="submit" value="Add Therapist">
    </form>
</div>
</body>
</html>
