<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Dog</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="page-overlay"></div>
<div class="navbar">
    <div class="logo"><a th:href="@{/}">DOGSHOW</a></div>

    <div class="nav-links">
        <a th:href="@{/addDog}">Add Dog</a>
        <a th:href="@{/addOwner}">Add Owner</a>
        <a th:href="@{/addJudge}">Add Judge</a>
        <a th:href="@{/assignOwner}">Assign Owner</a>
        <a th:href="@{/assignJudge}">Assign Judge</a>
        <a th:href="@{/viewDogs}">View Dogs</a>
        <a th:href="@{/viewOwners}">View Owners</a>
        <a th:href="@{/viewJudges}">View Judges</a>
    </div>
</div>

<div class="page-wrapper">

    <div class="container">
        <div class="page-header">
            <span class="page-eyebrow">Management</span>
            <h1 class="page-title">Add Dog</h1>
            <div class="page-line"></div>
        </div>

        <div class="form-card">
            <form th:action="@{/addDog}" th:object="${dog}" method="post">
                <div class="form-group">
                    <label>Dog Name</label>
                    <input type="text" th:field="*{name}" placeholder="Enter dog's name" />
                </div>

                <div class="form-group">
                    <label>Owner</label>
                    <select th:field="*{owner}">
                        <option value="">-- Select Owner --</option>
                        <option th:each="o : ${owners}" th:value="${o.id}" th:text="${o.firstName + ' ' + o.lastName}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Judges <span class="label-hint">(Hold Ctrl / Cmd to select multiple)</span></label>
                    <select multiple th:field="*{judges}" class="select-multi">
                        <option th:each="j : ${judges}" th:value="${j.id}" th:text="${j.name}"></option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit">Save Dog</button>
                    <a th:href="@{/}" class="btn-back">← Back to Home</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
