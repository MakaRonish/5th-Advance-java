<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>All Judges</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<div class="page-overlay"></div>
<div class="navbar">
    <div class="logo"><a th:href="@{/}">DOGSHOW</a></div>

    <div class="nav-links">
        <a th:href="@{/addDog}">Add Dog</a>
        <a th:href="@{/addOwner}">Add Owner</a>
        <a th:href="@{/addJudge}">Add Judge</a>
        <a th:href="@{/assignOwner}">Assign Owner</a>
        <a th:href="@{/assignJudge}">Assign Judge</a>
        <a th:href="@{/viewDogs}">View Dogs</a>
        <a th:href="@{/viewOwners}">View Owners</a>
        <a th:href="@{/viewJudges}">View Judges</a>
    </div>
</div>

<div class="page-wrapper">
    <div class="container">
        <div class="page-header">
            <span class="page-eyebrow">Registry</span>
            <h1 class="page-title">All Judges</h1>
            <div class="page-line"></div>
        </div>

        <div class="filter-bar">
            <form th:action="@{/viewJudges}" method="get">
                <div class="filter-row">
                    <label>Filter by Judge</label>
                    <select name="judgeId">
                        <option value="">— Show All —</option>
                        <option th:each="o : ${allJudges}" th:value="${o.id}" th:text="${o.name}"></option>
                    </select>
                    <button type="submit">Filter</button>
                </div>
            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Judge</th>
                    <th>Dogs Assigned</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="j : ${judges}">
                    <td th:text="${j.name}"></td>
                    <td>
                        <div class="nested-list">
                            <div class="nested-item" th:each="d : ${j.dogs}">
                                <span class="dog-name" th:text="${d.name}"></span>
                                <span class="owner-label">Owner: <span th:text="${d.owner.firstName + ' ' + d.owner.lastName}"></span></span>
                            </div>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="page-footer-link">
            <a th:href="@{/}">← Back to Home</a>
        </div>
    </div>
</div>

</body>
</html>
